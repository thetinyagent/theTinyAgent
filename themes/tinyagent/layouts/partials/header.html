{{ $logo := resources.Get "img/logo.png" }}
{{ $mark := resources.Get "img/mark.png" }}
<header class="site-header">
  <div class="shell header-row">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} — home">
      {{ with $logo }}
        {{ $small := .Resize "x40 png" }}
        <img class="logo-full" src="{{ $small.RelPermalink }}" width="{{ $small.Width }}" height="{{ $small.Height }}" alt="{{ site.Title }}">
      {{ end }}
      {{ with $mark }}
        {{ $small := .Resize "x40 png" }}
        <img class="logo-mark" src="{{ $small.RelPermalink }}" width="{{ $small.Width }}" height="{{ $small.Height }}" alt="{{ site.Title }}">
      {{ end }}
    </a>
    <nav aria-label="Primary">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" {{ if or (eq .URL $.RelPermalink) (and ($.Ancestors) ($.IsAncestor (site.GetPage .URL))) }}aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
